name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Run Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore DastavezStudio.slnx

      - name: Run unit test suite
        run: dotnet test tests/DastavezStudio.UnitTests/DastavezStudio.UnitTests.csproj -c Release

      - name: Build WinUI 3 App (win-x64)
        run: dotnet build src/DastavezStudio.App/DastavezStudio.App.csproj -c Release -r win-x64
